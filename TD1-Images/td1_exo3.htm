<!DOCTYPE html>
<html>
<head>
<!-- voir https://greensock.com/docs/v3/Installation#installer -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  svg { border: 1px solid #ccc; margin: 10px 0; }
</style>
</head>
<body>
<h2>TD1 - Exercice SVG</h2>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 16 9" id="dessin">
</svg>
<script src="svgelement.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
class Voilier {
    constructor(parent) {
        // groupe pour englober le voilier
        const g = parent.appendElement("g");

        // MÂT
        g.appendElement("rect", {
            x:"6",
            y:"0.5",
            width:"0.2",
            height:"5",
            fill:"#d3d3d3"
        });
        // VOILE
        g.appendElement("path", {
            d:"M 9,5 L 6,0.5 L 4,5 Z",
            fill:"#FFFFFF",
            stroke:"#000000",
            'stroke-width':"0.05"
        });
        //COQUE
        g.appendElement("path", {
            d:"M 9,5 L 3.5,5.3 L 3,6.5 L 8,6.5 Z",
            fill:"#850606"
        });

    }
}

class Paysage {
    constructor(parent) {
        // groupe pour le paysage
        const g = parent.appendElement("g");

        // CIEL
        g.appendElement("rect", {
            x:"0",
            y:"0",
            width:"100%",
            height:"100%",
            fill:"LightCyan"
        });
        // MER
        g.appendElement("rect", {
            x:"0",
            y:"6",
            width:"100%",
            height:"3",
            fill:"#1E90FF"
        });
        // SOLEIL
        g.appendElement("circle", {
            cx:"13",
            cy:"1.5",
            r:"1",
            fill:"#FFD700"
        });

        // Voilier
        const voilier = new Voilier(g, 6, 5);
    }
}

// Initialisation quand la page est prête
document.addEventListener('DOMContentLoaded', function() {
    const svg = SVGelement.fromSelector("#dessin");
    if (svg) {
        new Paysage(svg);
    }
});
</script>
</body>
</html>

<!--
Coque : path avec points (9,5), (3.5,5.3), (3,6.5), (8,6.5)
-->
