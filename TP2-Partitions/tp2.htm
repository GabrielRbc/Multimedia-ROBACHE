<html>
<head>
  <meta charset="UTF-8"/>
  <title>Dessin SVG avec d3.js</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" id="dessin"></svg>

  <script type="module">

// voir https://stackoverflow.com/a/65056488 (append if not exist)
d3.selection.prototype.appendIfAbsent = function(selector, type) {
  const element = this.select(selector)
  return element.empty() ? this.append(type) : element
}

function PartitionFloue(trapezes, transform = null) {
    console.log("TRAPEZES", trapezes);

    const width = 600;
    const height = width / 4;
    const margin = {top: 20, right: 10, bottom: 20, left: 10};

    const svg = d3.select("#dessin");
    svg.attr("width", width)
       .attr("height", height)
       .attr("viewBox", `0 0 ${width} ${height}`);

    const N = trapezes.length;

    trapezes.forEach(t => {
        t.prec = null;
        t.next = null;
    });
    for (let i = 0; i < N; i++) {
        if (i > 0) {
            trapezes[i].prec = trapezes[i - 1];
            trapezes[i - 1].next = trapezes[i];
        }
    }

    let fX = d3.scaleLinear()
        .domain([trapezes[0].supL - 1, trapezes[N - 1].supH + 1])
        .range([margin.left, width - margin.right]);
    
    if (transform != null) {
        fX = transform.rescaleX(fX);
    }

    const zoom = d3.zoom()
        .extent([[0, 0], [width, height]])
        .scaleExtent([0.25, 64])
        .on("zoom", ({transform}) => PartitionFloue(trapezes, transform));
    svg.call(zoom);

    const fY = d3.scaleLinear()
        .domain([0, 1])
        .range([height - margin.bottom, margin.top]);

    const fColor = d3.scaleOrdinal()
        .domain(d3.range(-1, 10, 1))
        .range(d3.schemeSet2);

    const bottom = fY(0);
    const top = fY(1);

    function onDragCorL(event, trp) {
        let x = fX.invert(event.x);
        if (x < trp.supL || x > trp.corH) return;
        trp.corL = x;
        if (trp.prec) trp.prec.supH = x;
        PartitionFloue(trapezes, transform);
    }

    function onDragCorH(event, trp) {
        let x = fX.invert(event.x);
        if (x < trp.corL || x > trp.supH) return;
        trp.corH = x;
        if (trp.next) trp.next.supL = x;
        PartitionFloue(trapezes, transform);
    }

    const grpTrapezes = svg.appendIfAbsent("#ida", "g").attr("id", "ida");

    grpTrapezes.selectAll("g")
        .data(trapezes, d => d.id)
        .join(
            enter => {
                const g = enter.append("g");

                g.append("path")
                    .attr("d", d => `M ${fX(d.supL)} ${bottom} L ${fX(d.corL)} ${top} L ${fX(d.corH)} ${top} L ${fX(d.supH)} ${bottom}`)
                    .attr("stroke", d => fColor(d.id))
                    .attr("stroke-width", 2)
                    .attr("fill", d => fColor(d.id))
                    .attr("fill-opacity", 0.4);

                g.append("text")
                    .text(trp => trp.nom)
                    .attr("x", d => fX((d.corL + d.corH) / 2))
                    .attr("y", (top + bottom) / 2)
                    .attr("text-anchor", "middle");

                g.append("circle")
                    .classed("corL", true)
                    .attr("cx", d => fX(d.corL))
                    .attr("cy", top)
                    .attr("r", 5)
                    .attr("stroke", d => fColor(d.id))
                    .attr("stroke-width", 2)
                    .attr("fill", d => fColor(d.id))
                    .attr("fill-opacity", 0.8)
                    .call(d3.drag().on("drag", onDragCorL));

                g.append("circle")
                    .classed("corH", true)
                    .attr("cx", d => fX(d.corH))
                    .attr("cy", top)
                    .attr("r", 5)
                    .attr("stroke", d => fColor(d.id))
                    .attr("stroke-width", 2)
                    .attr("fill", d => fColor(d.id))
                    .attr("fill-opacity", 0.8)
                    .call(d3.drag().on("drag", onDragCorH));
            },
            update => {
                update.select("path")
                    .attr("d", d => `M ${fX(d.supL)} ${bottom} L ${fX(d.corL)} ${top} L ${fX(d.corH)} ${top} L ${fX(d.supH)} ${bottom}`)
                    .attr("stroke", d => fColor(d.id))
                    .attr("stroke-width", 2)
                    .attr("fill", d => fColor(d.id))
                    .attr("fill-opacity", 0.4);

                update.select("text")
                    .text(trp => trp.nom)
                    .attr("x", d => fX((d.corL + d.corH) / 2))
                    .attr("y", (top + bottom) / 2)
                    .attr("text-anchor", "middle");

                update.select("circle.corL")
                    .attr("cx", d => fX(d.corL))
                    .attr("cy", top)
                    .call(d3.drag().on("drag", onDragCorL));

                update.select("circle.corH")
                    .attr("cx", d => fX(d.corH))
                    .attr("cy", top)
                    .call(d3.drag().on("drag", onDragCorH));
            }
        );

    svg.appendIfAbsent("#idb", "g").attr("id", "idb")
      .attr("transform", `translate(0,${bottom})`)
      .call(d3.axisBottom(fX));

    svg.appendIfAbsent("#idc", "g").attr("id", "idc")
      .attr("transform", `translate(0,${top})`)
      .call(d3.axisTop(fX));
}

const Trapezes = [
    { id: 0, supL: 5, corL: 11, corH: 14, supH: 18, nom: "froid" },
    { id: 1, supL: 14, corL: 18, corH: 20, supH: 22, nom: "frais" },
    { id: 2, supL: 20, corL: 22, corH: 24, supH: 30, nom: "tiède" },
    { id: 3, supL: 24, corL: 30, corH: 38, supH: 42, nom: "chaud" },
];

const Trapezes2 = [
    { id: -1, supL: 0, corL: 0, corH: 5, supH: 11, nom: "glacial" },
    ...Trapezes,
    { id: 4, supL: 38, corL: 42, corH: 60, supH: 80, nom: "brûlant" },
];

PartitionFloue(Trapezes2);

  </script>
</body>
</html>
